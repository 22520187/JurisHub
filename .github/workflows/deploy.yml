name: Deploy JurisHub to AWS

on:
  push:
    branches:
      - JurisHub/Deploy-V0
  workflow_dispatch: # Cho phép bấm chạy bằng tay trên web Github

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend/jurisHub
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jurishub-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jurishub-frontend:latest

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH commands on AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying latest images to AWS..."
            cd ~
            # Kéo ảnh mới nhất về
            sudo docker compose -f docker-compose.prod.yml pull
            # Chạy lại các hộp cơm với ảnh mới
            sudo docker compose -f docker-compose.prod.yml up -d
            echo "Deployment Successful!"
