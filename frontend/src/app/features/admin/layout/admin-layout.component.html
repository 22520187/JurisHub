<!-- Loading State -->
@if (isLoading) {
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <app-loading-spinner [visible]="true" message="Đang tải..."></app-loading-spinner>
</div>
} @else if (!isAuthorized) {
<!-- Access Denied State (Matching User's React Reference Code) -->
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light px-3">
  <div class="access-denied-card text-center p-4 p-md-5 bg-white rounded-4 shadow-sm border">
    <div class="denied-icon-wrapper mb-3 mx-auto d-flex align-items-center justify-content-center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    <h1 class="h4 fw-bold text-gray-900 mb-2">Truy cập bị từ chối</h1>
    <p class="text-muted mb-4 small">Bạn không có quyền truy cập vào trang quản trị này. Vui lòng đăng nhập với tài
      khoản quản trị viên.</p>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
      <app-button label="Về trang chủ" variant="outline" size="sm" (btnClick)="navigateToHome()"></app-button>
      <app-button label="Đăng nhập Admin (Demo)" variant="primary" size="sm"
        (btnClick)="setDemoAdminSession()"></app-button>
    </div>
  </div>
</div>
} @else {
<!-- Authorized Admin Dashboard Layout -->
<div class="admin-layout-root min-vh-100 d-flex">
  <!-- Admin Sidebar -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Main Content Area with Fixed Left Margin -->
  <div class="admin-content-wrapper flex-grow-1 d-flex flex-column min-vh-100">
    <!-- Top Header Matching UI Screenshot -->
    <header class="admin-top-header d-flex align-items-center justify-content-between px-4 sticky-top">
      <!-- Left: Current Page Title -->
      <div class="header-left">
        <h1 class="header-page-title mb-0">Quản trị hệ thống</h1>
      </div>

      <!-- Right: Actions & User Info -->
      <div class="header-right d-flex align-items-center">
        <!-- Notification Bell -->
        <button type="button" class="btn-icon-bell position-relative me-1" aria-label="Thông báo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <!-- Vertical Divider -->
        <div class="header-divider"></div>

        <!-- User Profile Block Matching UI -->
        <div class="header-user-block d-flex align-items-center">
          <!-- User Avatar (NV in blue circle) -->
          <div class="header-user-avatar d-flex align-items-center justify-content-center me-3">
            @if (user?.avatarUrl) {
            <img [src]="user?.avatarUrl" [alt]="user?.name" class="avatar-img" />
            } @else {
            <span class="avatar-initials">{{ userInitials }}</span>
            }
          </div>

          <!-- Name and ADMIN label -->
          <div class="header-user-meta d-flex flex-column">
            <span class="user-meta-name text-truncate">{{ user?.name}}</span>
            <span class="user-meta-role">ADMIN</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Outlet Content -->
    <main class="admin-main-content flex-grow-1">
      <div class="admin-page-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
}
