<div
  class="teller-btn-group"
  [class.teller-btn-group--block]="block"
  [class.teller-btn-group--vertical]="direction === 'vertical'"
  [class.teller-btn-group--attached]="attached"
  [style.justifyContent]="align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : align === 'center' ? 'center' : 'space-between'"
  [style.gap.px]="attached ? 0 : gap"
  role="group"
  [attr.aria-label]="ariaLabel"
>
  <tellerapp-button
    *ngFor="let btn of buttons; let i = index; let first = first; let last = last; trackBy: trackByBtn"
    [label]="btn.label || ''"
    [variant]="btn.variant || defaultVariant"
    [size]="btn.size || defaultSize"
    [shape]="attached ? 'default' : (btn.shape || defaultShape)"
    [customStyle]="btn.customStyle"
    [backgroundImage]="btn.backgroundImage"
    [backgroundImageOpacity]="btn.backgroundImageOpacity ?? 0.2"
    [iconLeft]="btn.iconLeft"
    [iconRight]="btn.iconRight"
    [badge]="btn.badge"
    [type]="btn.type || 'button'"
    [disabled]="btn.disabled || false"
    [loading]="btn.loading || false"
    [loadingText]="btn.loadingText"
    [block]="block && direction === 'horizontal'"
    [ariaLabel]="btn.ariaLabel"
    [class.teller-btn-group__item]="true"
    [class.teller-btn-group__item--first]="attached && first"
    [class.teller-btn-group__item--last]="attached && last"
    [class.teller-btn-group__item--middle]="attached && !first && !last"
    (btnClick)="onButtonClick($event, i, btn)"
  ></tellerapp-button>
</div>
