<div
  class="card custom-card"
  [ngStyle]="cardStyle"
  [ngClass]="{
    collapsed: isCollapsed && collapsible,
    'full-height': fullHeight,
  }"
>
  @if (collapsible || title) {
    <div
      class="card-header"
      [ngStyle]="styleHeader"
      role="button"
      tabindex="0"
      (click)="collapsible ? toggleCollapse() : null"
      [attr.aria-expanded]="!isCollapsed"
    >
      <h5 class="card-title mb-0">
        @if (collapsible) {
          <button
            type="button"
            class="icon-button"
            (click)="toggleCollapse(); $event.stopPropagation()"
            [attr.aria-expanded]="!isCollapsed"
          >
            <svg
              [class]="isCollapsed ? 'collapse-icon rotated' : 'collapse-icon'"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path d="M5 7.5L10 12.5L15 7.5" stroke="#505A5F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        }
        {{ title ? formatTitle(title) : '' }}
      </h5>
      <button class="header-actions" (click)="$event.stopPropagation()">
        <ng-content select="[card-header-right]"></ng-content>
      </button>
    </div>
  }
  <div class="collapse" [class.show]="!isCollapsed">
    <div class="card-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
